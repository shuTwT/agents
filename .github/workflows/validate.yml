name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check committed registry and catalog drift
        run: make check-drift
      - name: Generate all harness runtime artifacts
        run: make generate-all
      - name: Check agent name collisions
        run: python3 tools/check_agent_name_collisions.py --fail-on-duplicates
      - name: Run repository garden
        run: make garden STRICT=1
      - name: Generate and validate marketplace artifacts
        run: make validate
      - name: Run tests
        run: make test
      - name: Check release metadata
        run: make release-check
