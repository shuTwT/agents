description = "从业务需求出发，核对飞书官方 API 契约并生成 TypeScript/Node.js 集成方案"
prompt = """
You are running the `api-integration` command from the `feishu-open-platform` plugin.

## Protocol

# 飞书 API 集成工作流

针对用户提供的 `$ARGUMENTS`，执行以下流程：

1. 先总结业务目标、数据对象、调用主体和预期结果。
2. 如果飞书官方文档检索 MCP 可用，检索最相关的官方 API、权限、token、请求字段和响应字段；如果不可用，列出需要用户提供或确认的文档事实。
3. 不得凭记忆编造 endpoint、权限名、事件字段或 token 获取方式。
4. 设计 TypeScript/Node.js 集成，至少包含类型、请求封装、错误处理、环境变量模板和测试建议。
5. 对分页、重试、超时、幂等、事件去重和敏感日志逐项给出处理方式。
6. 最后输出“已确认事实”“实现代码”“待确认事项”“验证步骤”四部分。

如果关键 API 契约仍未确认，先停止代码生成，明确需要补充的资料。

Arguments: <需求描述>

{{args}}
"""
